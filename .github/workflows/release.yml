name: Release

# A tag like v0.2.0 publishes that version to npm, from here, with provenance.
# npm trusts this workflow (Trusted Publishing, OIDC): no token is stored
# anywhere, and nobody's laptop has to sign the release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: The tag is the package's version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # prepublishOnly typechecks, tests and builds first.
      - run: npm publish --access public
